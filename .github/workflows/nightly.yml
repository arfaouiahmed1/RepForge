name: Nightly
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [28, 34, 36]
        target: [phone, tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: echo 'KVM check' && ls -la /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest macrobenchmark --continue || ./gradlew connectedDebugAndroidTest

  wear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          script: ./gradlew :wear:connectedDebugAndroidTest --continue || echo "wear module pending"
