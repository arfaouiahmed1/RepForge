name: Perf
# Nightly macrobenchmark + baseline profile budgets (todo 48 owns budget gates;
# this file provides the separated perf pipeline and schedule).
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:

jobs:
  macrobenchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9 # v4.3.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Baseline profile + macrobenchmark
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:assembleRelease :baselineprofile:collectBaselineProfile :app:macrobenchmark || echo "baselineprofile/macrobenchmark tasks pending todo 48"
