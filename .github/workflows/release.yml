name: Release
# Tag-driven pipeline: v1.2.3 => full release; v*-beta / v*-rc* => GitHub prerelease.
# Artifacts: installable debug-signed APK (preview) + bundleRelease AAB (Play upload
# once signing + Developer API land in todo 54; oss/gms flavors in todo 59).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.4.0-beta)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9 # v4.3.1

      - name: Derive version metadata
        id: meta
        run: |
          VER="${TAG#v}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then PRERELEASE=false; else PRERELEASE=true; fi
          CODE="$(git rev-list --count HEAD)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build AAB + installable APK (debug-signed preview)
        run: >
          ./gradlew bundleRelease assembleDebug
          -PappVersionName=${{ steps.meta.outputs.version }}
          -PappVersionCode=${{ steps.meta.outputs.code }}

      - name: Stage artifacts
        run: |
          mkdir -p stage
          cp app/build/outputs/bundle/release/app-release.aab \
             "stage/RepForge-${{ steps.meta.outputs.tag }}.aab"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "stage/RepForge-${{ steps.meta.outputs.tag }}-debug-preview.apk"
          sha256sum stage/* > stage/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=( "$TAG"
            --title "RepForge $TAG"
            --generate-notes
            stage/RepForge-${TAG}.aab
            stage/RepForge-${TAG}-debug-preview.apk
            stage/SHA256SUMS.txt )
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            gh release create "${ARGS[@]}" --prerelease \
              --notes "Prerelease — APIs and data model may change. Debug-signed APK is for preview installs."
          else
            gh release create "${ARGS[@]}" --latest
          fi
