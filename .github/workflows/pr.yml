name: PR
on:
  pull_request:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless / ktlint / detekt
        run: ./gradlew spotlessCheck detekt --continue || echo "lint not yet configured — add Spotless/Detekt later"
      - name: Android Lint
        run: ./gradlew lintDebug

  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + Room + ML inference golden vectors
        run: ./gradlew testDebugUnitTest
      - name: Verify Room migrations
        run: ./gradlew verifyRoomMigrations --continue || echo "add Room schema export"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Screenshot tests (Today, Workout, Rest, Progress, Paywall — light/dark + font scale)
        run: ./gradlew screenshotTest --continue || echo "configure Paparazzi / Showkase screenshot tests"
