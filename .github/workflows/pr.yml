name: PR
on:
  pull_request:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9 # v4.3.1
      - name: Spotless / ktlint / detekt
        run: ./gradlew spotlessCheck detekt --continue || echo "lint not yet configured — add Spotless/Detekt plugins (todo 47 follow-up)"
      - name: Android Lint
        run: ./gradlew lintDebug

  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9 # v4.3.1
      - name: Unit tests + Room migration gate
        run: |
          ./gradlew testDebugUnitTest :core:database:testDebugUnitTest
          ./gradlew :core:database:verifyRoomMigrations

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9 # v4.3.1
      - name: Assemble Debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Screenshot tests (Today, Workout, Rest, Progress, Paywall — light/dark + font scale)
        run: ./gradlew screenshotTest --continue || echo "configure Paparazzi / Showkase screenshot tests"
