name: Asset Release
# Content-tag driven asset deployments: tag `asset-v<N>` => validate catalog +
# manifests => push content-addressed objects to R2 (immutable) + bump manifest.
# Real upload requires secrets CLOUDFLARE_API_TOKEN (+ wrangler.toml config);
# without them the job validates and fails soft with setup instructions (todo 7 README).
on:
  push:
    tags: ['asset-v*']
  workflow_dispatch:
    inputs:
      revision:
        description: 'Asset revision seq N for content keys'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVISION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }

      - name: Validate catalog (dry-run gate)
        run: |
          pip install pyyaml
          python tools/exercise-assets/build_assets.py \
            --catalog tools/exercise-assets/exercise_catalog.yaml \
            --out build/assets --dry-run

      - name: Transform + gate manifest (size ceiling, glTF magic, sha256)
        run: |
          python tools/asset-cdn/upload_assets.py \
            --build-dir build/assets \
            --manifest tools/exercise-assets/exercise_manifest.json \
            --out tools/asset-cdn/cdn-asset-manifest.json \
            --revision ${REVISION#asset-v}

      - name: Validate emitted manifest against v17 schema
        run: |
          python tools/asset-cdn/validate_manifest.py tools/asset-cdn/cdn-asset-manifest.json

      - name: Detect R2 credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "available=true" >> "$GITHUB_OUTPUT";
          else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to R2
        if: ${{ steps.creds.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pip install wrangler
          python tools/asset-cdn/upload_assets.py \
            --build-dir build/assets \
            --manifest tools/exercise-assets/exercise_manifest.json \
            --out tools/asset-cdn/cdn-asset-manifest.json \
            --revision ${REVISION#asset-v} --upload
