name: Visual
# Screenshot goldens (Paparazzi/Showkase) across light/dark/font scales.
# PLACEHOLDER pipeline: Paparazzi is wired in plan todo 49; until then this job
# documents the gate and fails soft so the separation exists without blocking PRs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: 'zulu', java-version: '17' }
      - uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9 # v4.3.1
      - name: Screenshot tests (Today, Workout, Rest, Progress, Paywall — light/dark + font scale)
        run: ./gradlew screenshotTest --continue || echo "configure Paparazzi / Showkase screenshot tests (todo 49)"
