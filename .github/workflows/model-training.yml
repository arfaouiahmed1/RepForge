name: Model Training
on:
  workflow_dispatch:
  schedule: [{ cron: '0 4 * * 1' }] # weekly candidate

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync deps (uv)
        working-directory: ml
        run: uv sync --group dev
      - name: Validate schema & temporal splits (never random-split user history)
        working-directory: ml
        run: uv run python training/validate.py
      - name: Train baseline (rule-based) + candidate (LightGBM / Logistic)
        working-directory: ml
        run: uv run python training/train.py --snapshot data/snapshot.parquet --out artifacts/
      - name: Evaluate — Brier, logloss, ROC-AUC, PR-AUC, calibration, cohort breakdown
        working-directory: ml
        run: uv run python training/evaluate.py --candidate artifacts/candidate.pkl --champion artifacts/champion.json
      - name: Latency & size benchmark (mobile p95 < target, size < target)
        working-directory: ml
        run: uv run python training/benchmark.py --model artifacts/candidate.tflite
      - name: Export LiteRT + model card
        working-directory: ml
        run: uv run python training/export.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-candidate
          path: ml/artifacts/
