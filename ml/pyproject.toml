[project]
name = "repforge-ml"
version = "0.1.0"
description = "RepForge progression model — P(target set completed at prescribed load within desired RIR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "polars==1.12.0",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "mlflow==2.18.0",
    "numpy==1.26.4",
    "pyarrow==18.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.6",
    "pytest==8.3.4",
    "jupyter==1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff==0.9.6",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
