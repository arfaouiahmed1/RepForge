[project]
name = "repforge-ml"
version = "0.1.0"
description = "RepForge progression model — P(target set completed at prescribed load within desired RIR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars==1.12.0",
    "scikit-learn==1.5.2",
    "numpy==1.26.4",
    "pyarrow==18.1.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright==1.29.5",
    "ruff==0.9.6",
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["training", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D101", "D102", "D103", "D105", "D203", "D213", "ISC001"]

[dependency-groups]
dev = [
    "basedpyright==1.29.5",
    "ruff==0.9.6",
    "pytest==8.3.4",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]
"training/train.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["training", "tests"]
exclude = ["**/__pycache__", "**/.venv", "artifacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
